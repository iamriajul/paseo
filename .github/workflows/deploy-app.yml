name: Deploy App

on:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"
      - "app-v*"
      - "!app-v*-beta.*"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.repository_owner == 'getpaseo' || startsWith(github.ref_name, 'app-v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Typecheck
        run: npm run typecheck --workspace=@getpaseo/app

      - name: Build web bundle
        run: npm run build:web --workspace=@getpaseo/app

      - name: Deploy to Cloudflare Pages
        working-directory: packages/app
        run: npx wrangler pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '10ed39a1dbf316e30abd0c409bed40d6' }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'paseo-app' }}
