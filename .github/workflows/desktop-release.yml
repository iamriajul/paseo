name: Desktop Release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
      - "desktop-macos-v*"
      - "desktop-linux-v*"
      - "desktop-windows-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string
      platform:
        description: "Optional desktop platform to build."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
      targets:
        description: "Comma-separated release targets for this run (e.g. desktop-macos-x64,desktop-windows, or all). Empty uses the RELEASE_TARGETS variable. See docs/fork-release.md."
        required: false
        default: ""
        type: string
      checkout_ref:
        description: "Optional branch/ref to checkout while using tag for release metadata."
        required: false
        default: ""
        type: string
      publish:
        description: "Publish built artifacts to GitHub Releases."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      rollout_hours:
        description: "Linear rollout duration in hours. Use 0 for instant rollout."
        required: false
        default: "36"
        type: string

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_ref || github.ref_name) || github.ref_name }}
  SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'false' }}
  ROLLOUT_HOURS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollout_hours || '36' }}
  DESKTOP_PACKAGE_PATH: "packages/desktop"
  PASEO_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
  PASEO_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}

jobs:
  # Fork: the RELEASE_TARGETS repository variable picks which desktop builds run, so a
  # disabled platform never starts a runner. See docs/fork-release.md#release-targets.
  release-targets:
    runs-on: ubuntu-latest
    outputs:
      desktop-macos: ${{ steps.resolve.outputs.desktop-macos }}
      macos-matrix: ${{ steps.resolve.outputs.macos-matrix }}
      desktop-linux: ${{ steps.resolve.outputs.desktop-linux }}
      desktop-windows: ${{ steps.resolve.outputs.desktop-windows }}
    steps:
      # The resolver ships with this workflow file, so it is read from the workflow's ref,
      # not CHECKOUT_REF: rebuilding an old tag still resolves targets.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Resolve release targets
        id: resolve
        env:
          RELEASE_TARGETS_INPUT: ${{ github.event.inputs.targets }}
          RELEASE_TARGETS_VARIABLE: ${{ vars.RELEASE_TARGETS }}
          RELEASE_TARGETS_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform || startsWith(github.ref_name, 'desktop-macos-v') && 'macos' || startsWith(github.ref_name, 'desktop-linux-v') && 'linux' || startsWith(github.ref_name, 'desktop-windows-v') && 'windows' || startsWith(github.ref_name, 'desktop-v') && 'desktop' || 'all' }}
        run: node scripts/release-targets.mjs >> "$GITHUB_OUTPUT"

  create-release:
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref_name, 'desktop-macos-v') && !startsWith(github.ref_name, 'desktop-linux-v') && !startsWith(github.ref_name, 'desktop-windows-v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'all' && github.event.inputs.publish != 'false') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fork: every release workflow creates through this script. See docs/fork-decisions.md#release-single-creator.
          ensure_args=(--repo "${{ github.repository }}" --tag "$RELEASE_TAG" --ensure)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            ensure_args+=(--prerelease)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ensure_args+=(--target "$CHECKOUT_REF")
          fi
          node scripts/github-release.mjs "${ensure_args[@]}"

  publish-macos:
    needs: [release-targets, create-release]
    if: ${{ always() && needs.release-targets.outputs.desktop-macos == 'true' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      # One leg per enabled arch: scripts/release-targets.mjs maps each to its runner.
      matrix: ${{ fromJSON(needs.release-targets.outputs.macos-matrix) }}
    permissions:
      contents: write
      packages: read
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Resolve fork app identity
        if: github.repository_owner != 'getpaseo'
        shell: bash
        run: node scripts/emit-fork-identity-env.mjs --owner "${{ github.repository_owner }}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Backport electron-builder#10172 to the pinned build tool only.
      # Remove this step when app-builder-lib is upgraded to a release containing it.
      - name: Repair temporary keychain password in signing tool
        shell: bash
        run: |
          node <<'KEYCHAIN_FIX'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifestPath = require.resolve('app-builder-lib/package.json');
          if (JSON.parse(fs.readFileSync(manifestPath, 'utf8')).version !== '26.8.1') {
            throw new Error('Reassess/remove the signing backport for the new app-builder-lib version');
          }
          const sourcePath = path.join(path.dirname(manifestPath), 'out/codeSign/macCodeSign.js');
          let source = fs.readFileSync(sourcePath, 'utf8');
          const replacements = [
            ['importCerts(keychainFile, certPaths, cscPasswords)', 'importCerts(keychainFile, certPaths, cscPasswords, keychainPassword)'],
            ['importCerts(keychainFile, paths, keyPasswords)', 'importCerts(keychainFile, paths, keyPasswords, keychainPassword)'],
            ['["set-key-partition-list", "-S", "apple-tool:,apple:", "-s", "-k", password, keychainFile]', '["set-key-partition-list", "-S", "apple-tool:,apple:", "-s", "-k", keychainPassword, keychainFile]'],
          ];
          for (const [before, after] of replacements) {
            if (source.split(before).length !== 2) throw new Error('Unexpected signing tool source; refusing to patch');
            source = source.replace(before, after);
          }
          fs.writeFileSync(sourcePath, source);
          KEYCHAIN_FIX

      - name: Set desktop package version from tag
        shell: bash
        run: node scripts/stamp-package-version.mjs --version "$DESKTOP_VERSION"

      - name: Build desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          # Metro's jest workers OOM on the generated ws-outbound.aot.js validator,
          # the last module in the web bundle. Node's default heap is sized from
          # runner RAM, which is not enough on the Intel runner.
          NODE_OPTIONS: --max-old-space-size=${{ matrix.node_heap_mb }}
        run: |
          set -euo pipefail
          export PASEO_REAL_XCRUN="$(command -v xcrun)"
          stapler_bin="$(mktemp -d)"
          trap 'rm -rf "$stapler_bin"' EXIT
          cat > "$stapler_bin/xcrun" <<'STAPLER'
          #!/bin/bash
          if [[ "${1:-}" != stapler || "${2:-}" != staple ]]; then
            exec "$PASEO_REAL_XCRUN" "$@"
          fi
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          for attempt in 1 2 3 4; do
            if "$PASEO_REAL_XCRUN" "$@" >"$output" 2>&1; then
              cat "$output"
              exit 0
            else
              status=$?
            fi
            cat "$output"
            if [[ "$status" != 68 || "$attempt" == 4 ]] ||
              ! grep -Fq 'NSURLErrorDomain Code=-1005' "$output"; then
              exit "$status"
            fi
            echo "::warning::Apple staple connection lost; retrying the same signed app ($attempt/4)" >&2
            sleep 30
          done
          STAPLER
          chmod +x "$stapler_bin/xcrun"
          export PATH="$stapler_bin:$PATH"
          build_args=(-- --publish never --mac --${{ matrix.electron_arch }})
          build_args+=("-c.publish.releaseType=$RELEASE_TYPE")
          build_args+=("-c.publish.channel=$RELEASE_CHANNEL")
          build_args+=("-c.publish.owner=$PASEO_UPDATE_GITHUB_OWNER")
          build_args+=("-c.publish.repo=$PASEO_UPDATE_GITHUB_REPO")
          if [[ -n "${PASEO_DESKTOP_APP_ID:-}" ]]; then
            build_args+=("-c.appId=$PASEO_DESKTOP_APP_ID")
          fi
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" || -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "Apple signing/notarization secrets are incomplete; building unsigned, unnotarized macOS artifacts."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            export PASEO_MAC_AD_HOC_SIGN=1
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            build_args+=("-c.mac.identity=null")
            build_args+=("-c.mac.notarize=false")
          fi
          npm run build:desktop "${build_args[@]}"

      - name: Verify macOS app signature
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          apps=()
          while IFS= read -r -d '' app; do
            apps+=("$app")
          done < <(find "$release_dir" -maxdepth 2 -type d -name "Paseo.app" -print0 | sort -z)
          if (( ${#apps[@]} == 0 )); then
            echo "::error::Expected packaged app not found under $release_dir"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=4 "$app"
          done
      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-macos-${{ matrix.electron_arch }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop artifacts to release
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          node scripts/upload-release-assets.mjs "$RELEASE_TAG" "$release_dir" "${{ github.repository }}"

      - name: Upload desktop artifacts to workflow
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.electron_arch }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.dmg
          retention-days: 7

      - name: Upload manifest artifact
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-${{ matrix.electron_arch }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/${{ env.RELEASE_CHANNEL }}-mac.yml
          retention-days: 1

  publish-linux:
    needs: [release-targets, create-release]
    if: ${{ always() && needs.release-targets.outputs.desktop-linux == 'true' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Resolve fork app identity
        if: github.repository_owner != 'getpaseo'
        shell: bash
        run: node scripts/emit-fork-identity-env.mjs --owner "${{ github.repository_owner }}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp package versions from tag
        shell: bash
        run: node scripts/stamp-package-version.mjs --version "$DESKTOP_VERSION"

      - name: Install Linux smoke display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth rpm

      - name: Build desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          build_args=(-- --publish never --linux --x64)
          build_args+=("-c.publish.releaseType=$RELEASE_TYPE")
          build_args+=("-c.publish.channel=$RELEASE_CHANNEL")
          build_args+=("-c.publish.owner=$PASEO_UPDATE_GITHUB_OWNER")
          build_args+=("-c.publish.repo=$PASEO_UPDATE_GITHUB_REPO")
          if [[ -n "${PASEO_DESKTOP_APP_ID:-}" ]]; then
            build_args+=("-c.appId=$PASEO_DESKTOP_APP_ID")
          fi
          npm run build:desktop "${build_args[@]}"

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop artifacts to release
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          node scripts/upload-release-assets.mjs "$RELEASE_TAG" "$release_dir" "${{ github.repository }}"

      - name: Upload desktop artifacts to workflow
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/*
          retention-days: 7

      - name: Upload manifest artifact
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-manifest
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/${{ env.RELEASE_CHANNEL }}-linux.yml
          retention-days: 1

  publish-windows:
    needs: [release-targets, create-release]
    if: ${{ always() && needs.release-targets.outputs.desktop-windows == 'true' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: write
      packages: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Resolve fork app identity
        if: github.repository_owner != 'getpaseo'
        shell: bash
        run: node scripts/emit-fork-identity-env.mjs --owner "${{ github.repository_owner }}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp package versions from tag
        shell: bash
        run: node scripts/stamp-package-version.mjs --version "$DESKTOP_VERSION"

      - name: Build desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          build_args=(-- --publish never --win --x64 --arm64)
          build_args+=("-c.publish.releaseType=$RELEASE_TYPE")
          build_args+=("-c.publish.channel=$RELEASE_CHANNEL")
          build_args+=("-c.publish.owner=$PASEO_UPDATE_GITHUB_OWNER")
          build_args+=("-c.publish.repo=$PASEO_UPDATE_GITHUB_REPO")
          if [[ -n "${PASEO_DESKTOP_APP_ID:-}" ]]; then
            build_args+=("-c.appId=$PASEO_DESKTOP_APP_ID")
          fi
          npm run build:desktop "${build_args[@]}"

      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-windows-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop artifacts to release
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          node scripts/upload-release-assets.mjs "$RELEASE_TAG" "$release_dir" "${{ github.repository }}"

      - name: Upload desktop artifacts to workflow
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/*
          retention-days: 7

      - name: Upload manifest artifact
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-manifest
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/${{ env.RELEASE_CHANNEL }}.yml
          retention-days: 1

  finalize-rollout:
    needs: [release-targets, publish-macos, publish-linux, publish-windows]
    if: ${{ always() && needs.release-targets.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'false') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-rollout-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            package-lock.json
            scripts
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mac manifest artifacts
        if: env.IS_SMOKE_TAG != 'true' && needs.publish-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: mac-manifest-*
          path: release-manifests

      - name: Download Linux manifest artifact
        if: env.IS_SMOKE_TAG != 'true' && needs.publish-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-manifest
          path: release-manifests/linux-manifest

      - name: Download Windows manifest artifact
        if: env.IS_SMOKE_TAG != 'true' && needs.publish-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-manifest
          path: release-manifests/windows-manifest

      - name: Assemble manifests and publish release
        if: env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_ENABLED: ${{ needs.release-targets.outputs.desktop-macos }}
          LINUX_ENABLED: ${{ needs.release-targets.outputs.desktop-linux }}
          WINDOWS_ENABLED: ${{ needs.release-targets.outputs.desktop-windows }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-manifests
          cd release-manifests
          manifests_dir="$PWD/final"
          mkdir -p "$manifests_dir"

          # Only the platforms this run's release targets enabled must publish a manifest.
          expected_manifests=()
          if [[ "$MACOS_ENABLED" == "true" ]]; then expected_manifests+=("${RELEASE_CHANNEL}-mac.yml"); fi
          if [[ "$LINUX_ENABLED" == "true" ]]; then expected_manifests+=("${RELEASE_CHANNEL}-linux.yml"); fi
          if [[ "$WINDOWS_ENABLED" == "true" ]]; then expected_manifests+=("${RELEASE_CHANNEL}.yml"); fi
          # Every release operation below goes by release id through github-release.mjs: npm
          # Global Install Release can publish the draft during this step, and a draft's
          # `untagged-…` slug 404s from then on. See docs/fork-decisions.md#release-single-creator.
          release_script=(node ../scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")
          "${release_script[@]}" --cleanup-duplicates > /dev/null
          existing_assets="$("${release_script[@]}" --asset-names)"
          for manifest_name in "${expected_manifests[@]+"${expected_manifests[@]}"}"; do
            if grep -Fxq "$manifest_name" <<< "$existing_assets"; then
              case "$manifest_name" in
                "${RELEASE_CHANNEL}-mac.yml") platform_result="${{ needs.publish-macos.result }}" ;;
                "${RELEASE_CHANNEL}-linux.yml") platform_result="${{ needs.publish-linux.result }}" ;;
                "${RELEASE_CHANNEL}.yml") platform_result="${{ needs.publish-windows.result }}" ;;
              esac
              if [[ "$platform_result" =~ ^(success|skipped)$ ]]; then
                "${release_script[@]}" --download-asset "$manifest_name" --dir "$manifests_dir"
              else
                "${release_script[@]}" --delete-asset "$manifest_name"
              fi
            fi
          done

          if [[ "${{ needs.publish-macos.result }}" == "success" ]]; then
            manifest_name="${RELEASE_CHANNEL}-mac.yml"
            # arm64 sorts first, so its top-level fields win when both arches built.
            node ../scripts/merge-mac-manifest.mjs \
              "$manifests_dir/${manifest_name}" \
              mac-manifest-*/"${manifest_name}"
          fi

          if [[ "${{ needs.publish-linux.result }}" == "success" ]]; then
            cp "linux-manifest/${RELEASE_CHANNEL}-linux.yml" "$manifests_dir/"
          fi

          if [[ "${{ needs.publish-windows.result }}" == "success" ]]; then
            cp "windows-manifest/${RELEASE_CHANNEL}.yml" "$manifests_dir/"
          fi

          shopt -s nullglob
          files=( "$manifests_dir"/*.yml )
          if (( ${#files[@]} == 0 && ${#expected_manifests[@]} > 0 )); then
            echo "::error::No manifest artifacts were available to publish"
            exit 1
          fi
          if (( ${#files[@]} > 0 )); then
            timestamp="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
            node ../scripts/stamp-rollout.mjs --release-date "$timestamp" --rollout-hours "$ROLLOUT_HOURS" "${files[@]}"
            node ../scripts/validate-desktop-manifests.mjs \
              --release-date "$timestamp" \
              --rollout-hours "$ROLLOUT_HOURS" \
              "${files[@]}"
            "${release_script[@]}" --upload "${files[@]}"
          else
            echo "No desktop release targets are enabled; publishing the release without updater manifests."
          fi

          failed_builds=()
          [[ "${{ needs.publish-macos.result }}" =~ ^(success|skipped)$ ]] || failed_builds+=(macOS)
          [[ "${{ needs.publish-linux.result }}" =~ ^(success|skipped)$ ]] || failed_builds+=(Linux)
          [[ "${{ needs.publish-windows.result }}" =~ ^(success|skipped)$ ]] || failed_builds+=(Windows)
          if (( ${#failed_builds[@]} > 0 )); then
            echo "::error::Desktop builds did not complete for ${failed_builds[*]}; Desktop Release did not publish the release"
            exit 1
          fi

          missing_manifests=()
          for manifest_name in "${expected_manifests[@]+"${expected_manifests[@]}"}"; do
            [[ -f "$manifests_dir/$manifest_name" ]] || missing_manifests+=("$manifest_name")
          done
          if (( ${#missing_manifests[@]} > 0 )); then
            echo "::error::Missing updater manifests: ${missing_manifests[*]}; Desktop Release did not publish the release"
            exit 1
          fi

          # npm Global Install Release may have published the release already; this then
          # only checks for duplicates. See docs/fork-decisions.md#release-single-creator.
          publish_args=(--publish)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            publish_args+=(--prerelease)
          fi
          "${release_script[@]}" "${publish_args[@]}"
