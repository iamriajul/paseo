<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media</title>
    <!-- The media panel puts its <video> or <audio> in this document: its requests then go
         through /media-stream/sw.js, which controls this scope. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      video {
        width: 100%;
        height: 100%;
        background: #000;
        object-fit: contain;
      }
      audio {
        width: calc(100% - 32px);
        max-width: 560px;
      }
    </style>
  </head>
  <body></body>
</html>
