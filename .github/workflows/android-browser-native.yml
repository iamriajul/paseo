name: Android Browser native

# Fork-owned: compiles the Android in-app Browser proxy module (decision
# browser-localhost-tunnel) and runs its Kotlin tests. It lives outside ci.yml so
# official CI edits neither conflict with it nor trigger a native build.
# GitHub does not evaluate path filters for tag pushes, so a release tag runs it only
# when RELEASE_TARGETS enables android-browser-native.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &android_browser_paths
      - ".github/workflows/android-browser-native.yml"
      - "package-lock.json"
      - "patches/react-native-webview+*.patch"
      - "scripts/postinstall-patches.mjs"
      - "packages/app/app.config.js"
      - "packages/app/package.json"
      - "packages/app/plugins/**"
      - "packages/app/modules/paseo-browser-proxy/**"
      - "packages/app/src/components/browser-pane.android.tsx"
      - "packages/app/src/native/mobile-browser-proxy*"
      - "packages/app/src/port-forward/controller.android.ts"
  pull_request:
    paths: *android_browser_paths
  workflow_dispatch:

concurrency:
  group: android-browser-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fork: the RELEASE_TARGETS repository variable decides whether a release tag runs
  # this check. Branch pushes, pull requests and dispatches always run it. See
  # docs/fork-release.md#release-targets.
  release-targets:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    outputs:
      android-browser-native: ${{ steps.resolve.outputs.android-browser-native }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Resolve release targets
        id: resolve
        env:
          RELEASE_TARGETS_VARIABLE: ${{ vars.RELEASE_TARGETS }}
          RELEASE_TARGETS_SCOPE: all
        run: node scripts/release-targets.mjs >> "$GITHUB_OUTPUT"

  android-browser-native:
    needs: [release-targets]
    if: ${{ !cancelled() && (!(github.event_name == 'push' && github.ref_type == 'tag') || needs.release-targets.outputs.android-browser-native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Generate Android project
        working-directory: packages/app
        run: CI=1 APP_VARIANT=development npx expo prebuild --platform android --non-interactive

      # arm64-v8a is the only ABI the fork APK ships (android-apk-release.yml). The
      # other three ABIs recompiled the same C++ and took 22 of the job's 38 minutes.
      - name: Test native proxy and compile debug app
        working-directory: packages/app/android
        run: |
          chmod +x ./gradlew
          ./gradlew :paseo-browser-proxy:testDebugUnitTest :app:assembleDebug \
            --no-daemon \
            -PreactNativeArchitectures=arm64-v8a
